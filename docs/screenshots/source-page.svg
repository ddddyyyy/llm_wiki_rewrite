  <text x="214" y="507" fill="#2D3B55" font-size="16" font-family="PingFang SC, Arial, sans-serif">我的贷款产品规程.md</text>
  <text x="650" y="507" fill="#9C6A1F" font-size="14" font-family="PingFang SC, Arial, sans-serif" font-weight="700">生成中</text>

  <rect x="188" y="570" width="604" height="226" rx="18" fill="#FFFDF8" stroke="#E8DFC9"/>
  <text x="214" y="610" fill="#2D3B55" font-size="18" font-family="PingFang SC, Arial, sans-serif" font-weight="700">批次状态说明</text>
  <text x="214" y="646" fill="#6D7A91" font-size="15" font-family="PingFang SC, Arial, sans-serif">• 上传成功后自动开始知识提取</text>
  <text x="214" y="678" fill="#6D7A91" font-size="15" font-family="PingFang SC, Arial, sans-serif">• 失败批次才显示“只提取本批 / 取消本批待处理”</text>
  <text x="214" y="710" fill="#6D7A91" font-size="15" font-family="PingFang SC, Arial, sans-serif">• 提取成功的来源可在同一行再次重新提取</text>
  <text x="214" y="742" fill="#6D7A91" font-size="15" font-family="PingFang SC, Arial, sans-serif">• PDF / DOCX / XLSX / PPTX 会优先复用缓存文本</text>

  <rect x="842" y="262" width="558" height="560" rx="20" fill="#FFFFFF" stroke="#E8DFC9"/>
  <text x="870" y="302" fill="#2D3B55" font-size="18" font-family="PingFang SC, Arial, sans-serif" font-weight="700">来源预览</text>
  <text x="870" y="330" fill="#6D7A91" font-size="15" font-family="PingFang SC, Arial, sans-serif">在当前页直接预览来源内容，不必再跳转到知识库页面。</text>
  <rect x="870" y="358" width="502" height="438" rx="18" fill="#FFFCF6" stroke="#EEE2C9"/>
  <text x="898" y="400" fill="#2D3B55" font-size="22" font-family="PingFang SC, Arial, sans-serif" font-weight="700">个人贷款管理办法.pdf</text>
  <text x="898" y="438" fill="#6D7A91" font-size="15" font-family="PingFang SC, Arial, sans-serif">已命中提取文本缓存，当前预览展示的是可检索、可问答复用的纯文本内容。</text>
  <text x="898" y="488" fill="#2D3B55" font-size="15" font-family="PingFang SC, Arial, sans-serif">第三章 贷款受理与身份核实</text>
  <text x="898" y="518" fill="#52627F" font-size="14" font-family="PingFang SC, Arial, sans-serif">贷款机构应保存视频面谈、电子签约以及身份核验记录，</text>
  <text x="898" y="546" fill="#52627F" font-size="14" font-family="PingFang SC, Arial, sans-serif">以备监管核查。对采用数字化核身替代面签的场景，应明确</text>
  <text x="898" y="574" fill="#52627F" font-size="14" font-family="PingFang SC, Arial, sans-serif">准入条件、风控边界和留痕要求……</text>
