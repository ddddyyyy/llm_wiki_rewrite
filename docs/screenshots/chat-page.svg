<svg width="1440" height="880" viewBox="0 0 1440 880" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="880" fill="#F8F6F2"/>
  <rect x="16" y="16" width="1408" height="848" rx="24" fill="#FFFDF8" stroke="#E8DFC9"/>
  <rect x="40" y="40" width="88" height="800" rx="20" fill="#FFF8EC" stroke="#E7D9BC"/>
  <rect x="56" y="72" width="56" height="12" rx="6" fill="#B58A3E"/>
  <rect x="56" y="428" width="56" height="36" rx="10" fill="#F4E8CE"/>
  <text x="160" y="88" fill="#2D3B55" font-size="28" font-family="PingFang SC, Arial, sans-serif" font-weight="700">问答页面</text>
  <text x="160" y="118" fill="#6D7A91" font-size="16" font-family="PingFang SC, Arial, sans-serif">支持多会话、流式输出、引用页跳转和综合页沉淀。</text>

  <rect x="160" y="152" width="280" height="670" rx="20" fill="#FFFFFF" stroke="#E8DFC9"/>
  <text x="188" y="193" fill="#2D3B55" font-size="18" font-family="PingFang SC, Arial, sans-serif" font-weight="700">对话列表</text>
  <rect x="302" y="170" width="110" height="36" rx="10" fill="#FFF8EC" stroke="#E7D9BC"/>
  <text x="327" y="193" fill="#9C6A1F" font-size="14" font-family="PingFang SC, Arial, sans-serif" font-weight="700">新建对话</text>
  <rect x="188" y="230" width="224" height="86" rx="16" fill="#FFF8EC" stroke="#E7D9BC"/>
  <text x="208" y="262" fill="#2D3B55" font-size="16" font-family="PingFang SC, Arial, sans-serif" font-weight="700">数字化核身合规清单</text>
  <text x="208" y="291" fill="#8A96AA" font-size="13" font-family="PingFang SC, Arial, sans-serif">4 条消息 · 刚刚更新</text>
  <rect x="188" y="332" width="224" height="86" rx="16" fill="#FFFDF8" stroke="#E7D9BC"/>
  <text x="208" y="364" fill="#2D3B55" font-size="16" font-family="PingFang SC, Arial, sans-serif" font-weight="700">贷款产品问题梳理</text>
  <text x="208" y="393" fill="#8A96AA" font-size="13" font-family="PingFang SC, Arial, sans-serif">2 条消息 · 昨天</text>

  <rect x="460" y="152" width="940" height="670" rx="20" fill="#FFFFFF" stroke="#E8DFC9"/>
  <text x="488" y="193" fill="#2D3B55" font-size="18" font-family="PingFang SC, Arial, sans-serif" font-weight="700">知识库问答</text>

  <rect x="488" y="228" width="858" height="118" rx="22" fill="#FFFCF6" stroke="#EEE2C9"/>
  <circle cx="540" cy="276" r="28" fill="#B58A3E"/>
  <text x="531" y="285" fill="#FFFFFF" font-size="22" font-family="PingFang SC, Arial, sans-serif" font-weight="700">你</text>
  <text x="584" y="266" fill="#2D3B55" font-size="22" font-family="PingFang SC, Arial, sans-serif" font-weight="700">如果监管要核查数字化核身，应该优先准备哪些材料？</text>

  <rect x="488" y="366" width="858" height="304" rx="22" fill="#FFFFFF" stroke="#EEE2C9"/>
  <circle cx="540" cy="416" r="28" fill="#F4E8CE"/>
  <text x="524" y="425" fill="#9C6A1F" font-size="22" font-family="PingFang SC, Arial, sans-serif" font-weight="700">AI</text>
  <text x="584" y="406" fill="#2D3B55" font-size="22" font-family="PingFang SC, Arial, sans-serif" font-weight="700">知识库回答</text>
  <text x="584" y="458" fill="#52627F" font-size="16" font-family="PingFang SC, Arial, sans-serif">优先准备三类材料：监管依据、内部规程、配套留痕记录。</text>
  <text x="584" y="492" fill="#52627F" font-size="16" font-family="PingFang SC, Arial, sans-serif">1. 《个人贷款管理办法》中的身份核实、视频面谈、电子签约条款。</text>
  <text x="584" y="522" fill="#52627F" font-size="16" font-family="PingFang SC, Arial, sans-serif">2. 本行产品规程中关于数字化核身替代流程和适用客群的章节。</text>
  <text x="584" y="552" fill="#52627F" font-size="16" font-family="PingFang SC, Arial, sans-serif">3. 实际业务留痕，包括录屏、签约记录、风控审批和异常补核验材料。</text>
  <rect x="584" y="594" width="156" height="30" rx="15" fill="#FFF8EC"/>
  <rect x="752" y="594" width="118" height="30" rx="15" fill="#FFF8EC"/>
  <rect x="882" y="594" width="132" height="30" rx="15" fill="#FFF8EC"/>
  <text x="612" y="613" fill="#9C6A1F" font-size="13" font-family="PingFang SC, Arial, sans-serif" font-weight="700">[1] 来源页：监管办法</text>
  <text x="781" y="613" fill="#9C6A1F" font-size="13" font-family="PingFang SC, Arial, sans-serif" font-weight="700">[2] 概念：合规边界</text>
  <text x="909" y="613" fill="#9C6A1F" font-size="13" font-family="PingFang SC, Arial, sans-serif" font-weight="700">保存为综合页</text>

  <rect x="488" y="694" width="858" height="96" rx="20" fill="#FFFCF6" stroke="#EEE2C9"/>
  <text x="516" y="742" fill="#8A96AA" font-size="18" font-family="PingFang SC, Arial, sans-serif">输入你想问的内容，例如：这个项目下一步应继续补哪些问题？</text>
  <rect x="1200" y="716" width="120" height="48" rx="12" fill="#B58A3E"/>
  <text x="1240" y="746" fill="#FFFFFF" font-size="18" font-family="PingFang SC, Arial, sans-serif" font-weight="700">提问</text>
</svg>
